<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackMyDocs</title>


    <!--Support css-->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <script src="https://kit.fontawesome.com/caeb9ec53e.js" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    {% load static %}

    <link rel="stylesheet" href="{% static 'track_my_docs/register.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'media_files/documentation.png' %}">

</head>

<body class="bg-[#1C2120] text-[#FFFFFF]">
    <p class="text-center mt-16 mb-5">Join <span class="font-bold text-xl">TrackMyDocs</span> to track Your ID status.
    </p>

    <div class="flex items-center justify-center text-black">
        <div class="bg-white max-w-xl w-full shadow-lg rounded-lg p-5">
            <form action="" method="POST" class="user-signup">
                {% csrf_token %}
                {{ form.as_p }}
                <p>
                    <input type="submit" value="Sign Up"
                        class="bg-green-500  w-full h-10 rounded cursor-pointer mt-4 font-bold hover:bg-green-400">
                </p>
                <div class="pt-5 text-center">
                    <p>Already Have Account?</p>
                    <p class="font-bold"><a href="{% url 'login' %}">Login !</a></p>
                </div>

            </form>
        </div>
    </div>
</body>

</html>
