<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>

    {% load static %}
    <!--Support css-->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <script src="https://kit.fontawesome.com/caeb9ec53e.js" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <link href="{% static 'track_my_docs/password_reset_form.css' %}" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{% static 'media_files/documentation.png' %}">

</head>

<body class="bg-[#1C2120] text-[#FFFFFF] pt-28">
    <h1 class="text-center pb-5">Reset your username password</h1>
    <div class="flex items-center justify-center text-black pt-3">
        <div class="bg-white max-w-xl w-full shadow-lg rounded-lg p-4">
            <form method="post" class="password-reset-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="bg-green-500 hover:bg-green-400 w-full h-10 rounded cursor-pointer mt-4 font-bold">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
