<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackMyDocs</title>

    {% load static %}
    <link href="{% static 'track_my_docs/login.css' %}" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{% static 'media_files/documentation.png' %}">

    <!--Support css-->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <script src="https://kit.fontawesome.com/caeb9ec53e.js" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

</head>

<body class="bg-[#1C2120] text-[#FFFFFF]">
    <div class="pt-8">
        <div class="text-center pb-3">
            
            <i class="fa-solid fa-file text-6xl mt-4 " ></i>
        </div>
        <p class="text-center pb-3 font-bold"><span class="text-xl">Welcome to TrackMyDocs </span>
            <br>
            <br>
            <span>Your go-to platform for tracking your ID status.</span>
        </p>
        <div class="flex items-center justify-center text-black pt-3">
            <div class="bg-white max-w-xl w-full shadow-lg rounded-lg p-4">
                <form action="" method="POST" class="login ">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <input type="hidden" name="next" value="{{ next }}">
                    <p>
                        <input type="submit" value="Log In"
                            class="bg-green-500 w-full h-10 rounded cursor-pointer mt-4 font-bold hover:bg-green-400">
                    </p>
                    <p class="pt-3 text-center">Do not have an account?
                        <a href="{% url 'track_my_docs:user-signup' %}">
                            <br><span class="font-bold ">Sign up !</span>
                        </a>
                    </p>

                    <p class="text-center pt-3">
                        Forgot Password?
                    </p>
                    <p class="font-bold text-center">
                        <a href="{% url 'password_reset' %}">Reset !</a>
                    </p>
                    
                </form>
            </div>
        </div>
    </div>
</body>

</html>
